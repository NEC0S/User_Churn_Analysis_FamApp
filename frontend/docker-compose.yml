services:
  backend:
    build:
      context: ../backend
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      args:
        # This URL is called from the USER'S BROWSER, not from inside the container,
        # so it must be the backend's host-reachable address (its published port),
        # not the internal compose service name.
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
