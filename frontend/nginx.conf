server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static files directly; fall back to index.html for any other path
    # (needed if client-side routing is ever added -- harmless no-op today).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build assets aggressively; index.html itself is never cached
    # so a redeploy is picked up immediately.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
